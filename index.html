<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HourCraft Pro • Gestion Avancée</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --accent: #38bdf8;
      --danger: #ef4444;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 1400px; margin: 0 auto; }
    
    .header { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
    .header h1 { margin: 0; font-size: 1.3rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text); }
    .badges-group { display: flex; gap: 8px; }
    .badge { background: #0f172a; border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text); transition: 0.2s; font-weight: 600; }
    .badge:hover { border-color: var(--primary); background: #1e293b; }

    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
    .stat-card span { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .stat-card h3 { margin: 6px 0 0 0; font-size: 1.5rem; color: var(--primary); }

    .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: var(--card); padding: 10px 16px; border-radius: 14px; border: 1px solid var(--border); }
    .btn-icon { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
    .day-card { flex: 1; min-width: 75px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 6px; text-align: center; cursor: pointer; position: relative; transition: 0.2s; }
    .day-card:hover { border-color: var(--text-muted); }
    .day-card.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: bold; }
    .day-progress { position: absolute; bottom: 6px; left: 8px; right: 8px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
    .day-progress-bar { height: 100%; background: var(--accent); width: 0%; }
    .day-card.active .day-progress-bar { background: #000; }

    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-weight: 700; font-size: 1.1rem; }
    #slots-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    
    .slot-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); position: relative; transition: 0.2s; }
    .slot-card:hover { border-color: var(--card-hover); }
    .slot-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .slot-time { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    .slot-club { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; }
    .slot-actions { display: flex; gap: 6px; }
    .btn-action { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .btn-action:hover { background: var(--card-hover); border-color: var(--text-muted); }

    .select-wrapper { position: relative; width: 100%; margin-top: 10px; }
    .select-wrapper::before { content: ''; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; border-radius: 50%; background: var(--dot-color, #ccc); z-index: 2; pointer-events: none; }
    select { width: 100%; padding: 12px 12px 12px 36px; border-radius: 12px; border: 1px solid var(--border); font-size: 0.95rem; background: var(--bg); color: var(--text); appearance: none; cursor: pointer; font-weight: 600; outline: none; }
    select:focus { border-color: var(--accent); }

    .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin-top: 20px; margin-bottom: 20px; max-width: 500px; box-shadow: var(--shadow); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; color: var(--text-muted); }
    .form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--bg); color: var(--text); outline: none; }
    .form-control:focus { border-color: var(--accent); }

    .btn-submit { width: 100%; background: var(--primary); color: #000; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-cancel { width: 100%; background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-cancel:hover { background: var(--bg); color: var(--text); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
    .modal-card { background: var(--card); width: 100%; max-width: 480px; border-radius: 24px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
    .modal-close { position: absolute; top: 18px; right: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; color: var(--text); transition: 0.2s; }
    .modal-close:hover { background: var(--danger); border-color: var(--danger); color: #fff; }

    .toggle-container { display: flex; background: var(--bg); border-radius: 14px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--border); }
    .toggle-btn { flex: 1; padding: 10px; text-align: center; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-muted); transition: 0.2s; }
    .toggle-btn.active { background: var(--primary); color: #000; }

    .total-banner { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 16px; }
    .total-banner h2 { color: var(--primary); margin: 0 0 6px 0; font-size: 2.2rem; }
    .total-banner p { margin: 0; font-size: 0.85rem; color: var(--text-muted); }

    .agent-card-item { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
    .agent-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-weight: 600; }
    .agent-info { display: flex; align-items: center; gap: 12px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .agent-right { display: flex; align-items: center; gap: 10px; font-size: 1rem; }

    .btn-agent-plus { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; font-weight: bold; color: var(--text); transition: 0.2s; }
    .btn-agent-plus:hover { border-color: var(--accent); color: var(--accent); }

    .agent-rate-panel { background: #1e293b; border-top: 1px solid var(--border); padding: 12px 16px; display: none; align-items: center; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); }
    .agent-rate-panel.open { display: flex; }
    .agent-rate-panel input { width: 90px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; text-align: center; font-weight: 700; font-size: 0.95rem; background: var(--bg); color: var(--text); outline: none; }
    .agent-rate-panel input:focus { border-color: var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <div style="color: var(--primary); font-size: 0.75rem; font-weight: 800; letter-spacing: 1px;">HOURCRAFT • PRO DASHBOARD</div>
      <h1>Planning & Heures</h1>
    </div>
    <div class="badges-group">
      <div class="badge" onclick="openTotalModal()">⏱️ Totaux</div>
      <div class="badge" onclick="openAgentsModal()">👥 <span id="agent-count-badge">0</span></div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <span>Créneaux cette semaine</span>
      <h3 id="stat-total-slots">0</h3>
    </div>
    <div class="stat-card">
      <span>Taux de couverture</span>
      <h3 id="stat-coverage-rate">0%</h3>
    </div>
  </div>

  <div class="nav">
    <button class="btn-icon" onclick="changeWeek(-1)">‹</button>
    <strong id="week-label" style="font-size: 0.95rem;"></strong>
    <button class="btn-icon" onclick="changeWeek(1)">›</button>
  </div>

  <div class="days" id="days-container"></div>

  <div class="section-header">
    <span id="selected-day-title"></span>
    <span id="day-covered-count" style="font-size: 0.9rem; color: var(--primary);">0/0 couverts</span>
  </div>

  <div id="slots-list"></div>

  <button class="btn-submit" onclick="showForm()" style="max-width: 250px; margin-top: 20px;">+ Ajouter un créneau</button>

  <div class="form-card" id="slot-form" style="display: none;">
    <h3 id="form-title" style="margin-top:0;">Nouveau créneau</h3>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Début / Fin</label>
      <div style="display: flex; gap: 10px;">
        <input type="time" id="form-start" class="form-control" value="09:00">
        <input type="time" id="form-end" class="form-control" value="13:00">
      </div>
    </div>
    <div class="form-group">
      <label>Club / Lieu</label>
      <input type="text" id="form-club" class="form-control" placeholder="ex. Thillois, Cernay...">
    </div>
    <button class="btn-submit" onclick="saveSlot()" style="max-width: none;">Enregistrer le créneau</button>
    <button class="btn-cancel" onclick="hideForm()">Annuler</button>
  </div>
</div>

<!-- MODALE TOTAUX -->
<div class="modal-overlay" id="total-modal" style="display: none;">
  <div class="modal-card">
    <button class="modal-close" onclick="closeTotalModal()">✕</button>
    <h3 style="margin-top:0; margin-bottom: 16px;">Totaux & Paie</h3>

    <div class="toggle-container">
      <button class="toggle-btn" id="btn-semaine" onclick="switchTotalTab('semaine')">Semaine</button>
      <button class="toggle-btn active" id="btn-mois" onclick="switchTotalTab('mois')">Mois</button>
    </div>

    <div class="nav" style="margin-bottom: 12px; background: var(--bg);">
      <button class="btn-icon" onclick="changeModalDate(-1)">‹</button>
      <strong id="modal-period-label"></strong>
      <button class="btn-icon" onclick="changeModalDate(1)">›</button>
    </div>

    <div class="total-banner">
      <h2 id="modal-total-hours">0h00 / 0h00</h2>
      <p>heures couvertes (+30 min de pointage incluses)</p>
    </div>

    <div style="display:flex; justify-content: flex-end; margin-bottom: 12px;">
      <button class="badge" onclick="exportSummary()" style="font-size: 0.75rem; padding: 6px 10px;">📋 Copier le récap</button>
    </div>

    <div id="modal-agents-list"></div>
  </div>
</div>

<!-- MODALE GESTION AGENTS -->
<div class="modal-overlay" id="agents-modal" style="display: none;">
  <div class="modal-card">
    <button class="modal-close" onclick="closeAgentsModal()">✕</button>
    <h3 style="margin-top:0; margin-bottom: 16px;">Gestion des agents</h3>

    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <input type="text" id="new-agent-name" class="form-control" placeholder="Nom du nouvel agent">
      <button class="btn-submit" style="margin-top:0; width: auto; padding: 0 16px;" onclick="addAgent()">Ajouter</button>
    </div>

    <div id="agents-manage-list"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://inyonzcwfjhzuzlhumzj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_s_-vJjAZgAbMy27Oh0RDpg_hxcJV1KX";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentDate = new Date();
  let selectedDateStr = new Date().toISOString().split('T')[0];
  let agents = [];
  let slots = [];
  
  let modalTab = 'mois';
  let modalDate = new Date();
  let agentRates = {}; 
  let openRateAgents = {}; 

  const agentColors = ['#22c55e', '#38bdf8', '#ec4899', '#a78bfa', '#fbbf24', '#06b6d4', '#10b981'];

  async function init() {
    await fetchAgents();
    await fetchSlots();
    renderWeek();
  }

  async function fetchAgents() {
    const { data } = await db.from('agents').select('*').order('name');
    agents = data || [];
    document.getElementById('agent-count-badge').innerText = agents.length;
  }

  async function fetchSlots() {
    const { data } = await db.from('slots').select('*');
    slots = data || [];
    renderWeek();
    renderSlots();
    updateHeaderStats();
    if (document.getElementById('total-modal').style.display === 'flex') {
      updateModalContent();
    }
  }

  function updateHeaderStats() {
    const startOfWeek = getMonday(currentDate);
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(endOfWeek.getDate() + 6);

    const weekSlots = slots.filter(s => {
      const d = new Date(s.date_str);
      return d >= startOfWeek && d <= endOfWeek;
    });

    const total = weekSlots.length;
    const covered = weekSlots.filter(s => s.agent_id !== null).length;
    const percent = total > 0 ? Math.round((covered / total) * 100) : 0;

    document.getElementById('stat-total-slots').innerText = total;
    document.getElementById('stat-coverage-rate').innerText = `${percent}%`;
  }

  function renderWeek() {
    const container = document.getElementById('days-container');
    container.innerHTML = '';
    const startOfWeek = getMonday(currentDate);
    
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(endOfWeek.getDate() + 6);
    document.getElementById('week-label').innerText = `${startOfWeek.toLocaleDateString('fr-FR', {day: 'numeric', month: 'long'})} – ${endOfWeek.toLocaleDateString('fr-FR', {day: 'numeric', month: 'long', year: 'numeric'})}`;

    for (let i = 0; i < 7; i++) {
      const d = new Date(startOfWeek);
      d.setDate(d.getDate() + i);
      const dateStr = d.toISOString().split('T')[0];
      const dayName = d.toLocaleDateString('fr-FR', { weekday: 'short' });
      const dayNum = d.getDate();

      const daySlots = slots.filter(s => s.date_str === dateStr);
      const totalDay = daySlots.length;
      const coveredDay = daySlots.filter(s => s.agent_id !== null).length;
      const percent = totalDay > 0 ? (coveredDay / totalDay) * 100 : 0;

      const card = document.createElement('div');
      card.className = `day-card ${dateStr === selectedDateStr ? 'active' : ''}`;
      card.innerHTML = `
        <div style="font-size:0.8rem">${dayName}</div>
        <strong style="font-size: 1.1rem;">${dayNum}</strong>
        <div class="day-progress">
          <div class="day-progress-bar" style="width: ${percent}%;"></div>
        </div>
      `;
      card.onclick = () => { selectedDateStr = dateStr; renderWeek(); renderSlots(); };
      container.appendChild(card);
    }
  }

  function renderSlots() {
    const list = document.getElementById('slots-list');
    list.innerHTML = '';
    const daySlots = slots.filter(s => s.date_str === selectedDateStr);

    const selDate = new Date(selectedDateStr + 'T00:00:00');
    document.getElementById('selected-day-title').innerText = selDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

    const covered = daySlots.filter(s => s.agent_id !== null).length;
    document.getElementById('day-covered-count').innerText = `${covered}/${daySlots.length} couverts`;

    if (daySlots.length === 0) {
      list.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:30px; grid-column: 1 / -1;">Aucun créneau planifié pour ce jour.</div>`;
      return;
    }

    daySlots.forEach(s => {
      const card = document.createElement('div');
      card.className = 'slot-card';
      
      let agentOptions = `<option value="">— À pourvoir —</option>`;
      let selectedAgentColor = '#64748b';

      agents.forEach((a, index) => {
        const isSelected = s.agent_id === a.id;
        if (isSelected) {
          selectedAgentColor = agentColors[index % agentColors.length];
        }
        agentOptions += `<option value="${a.id}" ${isSelected ? 'selected' : ''}>${a.name}</option>`;
      });

      card.style.setProperty('--dot-color', selectedAgentColor);

      card.innerHTML = `
        <div class="slot-top">
          <div>
            <div class="slot-time">${s.start} – ${s.end}</div>
            <div class="slot-club">📍 ${s.club || 'Non précisé'}</div>
          </div>
          <div class="slot-actions">
            <button class="btn-action" onclick="editSlot('${s.id}')">✏️</button>
            <button class="btn-action" onclick="deleteSlot('${s.id}')">🗑️</button>
          </div>
        </div>
        <div class="select-wrapper">
          <select onchange="updateAgent('${s.id}', this.value)">${agentOptions}</select>
        </div>
      `;
      list.appendChild(card);
    });
  }

  function showForm(slot = null) {
    const formCard = document.getElementById('slot-form');
    formCard.style.display = 'block';
    formCard.scrollIntoView({ behavior: 'smooth' });

    if (slot) {
      document.getElementById('form-title').innerText = "Modifier le créneau";
      document.getElementById('edit-id').value = slot.id;
      document.getElementById('form-start').value = slot.start;
      document.getElementById('form-end').value = slot.end;
      document.getElementById('form-club').value = slot.club || '';
    } else {
      document.getElementById('form-title').innerText = "Nouveau créneau";
      document.getElementById('edit-id').value = '';
      document.getElementById('form-start').value = '09:00';
      document.getElementById('form-end').value = '13:00';
      document.getElementById('form-club').value = '';
    }
  }

  function hideForm() {
    document.getElementById('slot-form').style.display = 'none';
  }

  async function saveSlot() {
    const id = document.getElementById('edit-id').value;
    const start = document.getElementById('form-start').value;
    const end = document.getElementById('form-end').value;
    const club = document.getElementById('form-club').value;

    if (id) {
      await db.from('slots').update({ start, end, club }).eq('id', id);
    } else {
      await db.from('slots').insert([{ date_str: selectedDateStr, start, end, club }]);
    }

    hideForm();
    await fetchSlots();
  }

  function editSlot(id) {
    const slot = slots.find(s => String(s.id) === String(id));
    if (slot) showForm(slot);
  }

  async function updateAgent(slotId, agentId) {
    await db.from('slots').update({ agent_id: agentId ? parseInt(agentId) : null }).eq('id', slotId);
    await fetchSlots();
  }

  async function deleteSlot(id) {
    if (confirm('Supprimer ce créneau ?')) {
      await db.from('slots').delete().eq('id', id);
      await fetchSlots();
    }
  }

  function openAgentsModal() {
    document.getElementById('agents-modal').style.display = 'flex';
    renderAgentsManageList();
  }

  function closeAgentsModal() {
    document.getElementById('agents-modal').style.display = 'none';
  }

  async function addAgent() {
    const nameInput = document.getElementById('new-agent-name');
    const name = nameInput.value.trim();
    if (!name) return;

    await db.from('agents').insert([{ name }]);
    nameInput.value = '';
    await fetchAgents();
    renderAgentsManageList();
    renderSlots();
  }

  async function deleteAgent(id) {
    if (confirm('Supprimer cet agent ?')) {
      await db.from('agents').delete().eq('id', id);
      await fetchAgents();
      renderAgentsManageList();
      fetchSlots();
    }
  }

  function renderAgentsManageList() {
    const container = document.getElementById('agents-manage-list');
    container.innerHTML = '';
    agents.forEach((a, index) => {
      const color = agentColors[index % agentColors.length];
      const row = document.createElement('div');
      row.className = 'agent-row';
      row.innerHTML = `
        <div class="agent-info">
          <div class="dot" style="background: ${color};"></div>
          <span>${a.name}</span>
        </div>
        <button class="btn-action" onclick="deleteAgent('${a.id}')">🗑️</button>
      `;
      container.appendChild(row);
    });
  }

  function openTotalModal() {
    modalDate = new Date(currentDate);
    document.getElementById('total-modal').style.display = 'flex';
    updateModalContent();
  }

  function closeTotalModal() {
    document.getElementById('total-modal').style.display = 'none';
  }

  function switchTotalTab(tab) {
    modalTab = tab;
    document.getElementById('btn-semaine').className = `toggle-btn ${tab === 'semaine' ? 'active' : ''}`;
    document.getElementById('btn-mois').className = `toggle-btn ${tab === 'mois' ? 'active' : ''}`;
    updateModalContent();
  }

  function changeModalDate(direction) {
    if (modalTab === 'mois') {
      modalDate.setMonth(modalDate.getMonth() + direction);
    } else {
      modalDate.setDate(modalDate.getDate() + (direction * 7));
    }
    updateModalContent();
  }

  function toggleAgentRateBox(agentId) {
    openRateAgents[agentId] = !openRateAgents[agentId];
    updateModalContent();
  }

  function updateAgentRate(agentId, val) {
    const rate = parseFloat(val);
    if (!isNaN(rate) && rate >= 0) {
      agentRates[agentId] = rate;
    } else {
      delete agentRates[agentId];
    }
    updateCalculationsOnlyValues();
  }

  function getFilteredSlots() {
    if (modalTab === 'mois') {
      const year = modalDate.getFullYear();
      const month = modalDate.getMonth();
      return slots.filter(s => {
        const d = new Date(s.date_str);
        return d.getFullYear() === year && d.getMonth() === month;
      });
    } else {
      const startOfWeek = getMonday(modalDate);
      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(endOfWeek.getDate() + 6);
      return slots.filter(s => {
        const d = new Date(s.date_str);
        return d >= startOfWeek && d <= endOfWeek;
      });
    }
  }

  function updateCalculationsOnlyValues() {
    const filteredSlots = getFilteredSlots();
    let agentHours = {};
    agents.forEach(a => agentHours[a.id] = { id: a.id, name: a.name, minutes: 0 });
    let totalGlobalMins = 0;
    let totalAgentsMins = 0;

    filteredSlots.forEach(s => {
      if (s.start && s.end) {
        const [sh, sm] = s.start.split(':').map(Number);
        const [eh, em] = s.end.split(':').map(Number);
        const diff = (eh * 60 + em) - (sh * 60 + sm) + 30; // +30 min incluses
        if (diff > 0) {
          totalGlobalMins += diff;
          if (s.agent_id !== null && agentHours[s.agent_id]) {
            agentHours[s.agent_id].minutes += diff;
            totalAgentsMins += diff;
          }
        }
      }
    });

    const totalAgentsH = Math.floor(totalAgentsMins / 60);
    const totalAgentsM = totalAgentsMins % 60;
    const totalGlobalH = Math.floor(totalGlobalMins / 60);
    const totalGlobalM = totalGlobalMins % 60;
    const sortedAgents = Object.values(agentHours).sort((a, b) => b.minutes - a.minutes);

    let activeRateUsed = null;
    for (let id in agentRates) {
      if (agentRates[id] !== undefined && agentRates[id] >= 0) {
        activeRateUsed = agentRates[id];
        break; 
      }
    }

    sortedAgents.forEach(ag => {
      const rightContainer = document.getElementById(`agent-right-${ag.id}`);
      if (rightContainer) {
        const h = Math.floor(ag.minutes / 60);
        const m = ag.minutes % 60;
        
        const timeSpan = rightContainer.querySelector('.agent-time-text');
        if (timeSpan) timeSpan.innerText = `${h}h${m < 10 ? '0' : ''}${m}`;

        let existingRev = document.getElementById(`agent-rev-${ag.id}`);
        const activeRate = agentRates[ag.id];
        
        if (activeRate !== undefined && activeRate >= 0) {
          const agentRevenue = (ag.minutes / 60) * activeRate;
          const agentRevenueStr = agentRevenue.toFixed(2);
          if (existingRev) {
            existingRev.innerText = `(${agentRevenueStr} €)`;
          } else {
            rightContainer.insertAdjacentHTML('beforeend', ` <span style="color: var(--primary); font-size: 0.85rem;" id="agent-rev-${ag.id}">(${agentRevenueStr} €)</span>`);
          }
        } else if (existingRev) {
          existingRev.remove();
        }
      }
    });

    const totalHoursEl = document.getElementById('modal-total-hours');
    const agentsTextStr = `${totalAgentsH}h${totalAgentsM < 10 ? '0' : ''}${totalAgentsM}`;
    const globalTextStr = `${totalGlobalH}h${totalGlobalM < 10 ? '0' : ''}${totalGlobalM}`;

    if (activeRateUsed !== null) {
      const totalAgentsDecimal = totalAgentsMins / 60;
      const globalCalculatedRevenue = totalAgentsDecimal * activeRateUsed;
      totalHoursEl.innerText = `${agentsTextStr} / ${globalTextStr} (${globalCalculatedRevenue.toFixed(2)} €)`;
    } else {
      totalHoursEl.innerText = `${agentsTextStr} / ${globalTextStr}`;
    }
  }

  function updateModalContent() {
    const labelEl = document.getElementById('modal-period-label');
    const agentsListEl = document.getElementById('modal-agents-list');

    if (modalTab === 'mois') {
      labelEl.innerText = modalDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    } else {
      const startOfWeek = getMonday(modalDate);
      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(endOfWeek.getDate() + 6);
      labelEl.innerText = `${startOfWeek.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'})} – ${endOfWeek.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short', year: 'numeric'})}`;
    }

    const filteredSlots = getFilteredSlots();
    let agentHours = {};
    agents.forEach(a => agentHours[a.id] = { id: a.id, name: a.name, minutes: 0 });

    filteredSlots.forEach(s => {
      if (s.start && s.end && agentHours[s.agent_id]) {
        const [sh, sm] = s.start.split(':').map(Number);
        const [eh, em] = s.end.split(':').map(Number);
        const diff = (eh * 60 + em) - (sh * 60 + sm) + 30;
        if (diff > 0) agentHours[s.agent_id].minutes += diff;
      }
    });

    const sortedAgents = Object.values(agentHours).sort((a, b) => b.minutes - a.minutes);
    agentsListEl.innerHTML = '';

    sortedAgents.forEach((ag, index) => {
      const h = Math.floor(ag.minutes / 60);
      const m = ag.minutes % 60;
      const color = agentColors[index % agentColors.length];

      let revenueText = '';
      const activeRate = agentRates[ag.id];
      if (activeRate !== undefined && activeRate >= 0) {
        const agentRevenue = ((ag.minutes / 60) * activeRate).toFixed(2);
        revenueText = ` <span style="color: var(--primary); font-size: 0.85rem;" id="agent-rev-${ag.id}">(${agentRevenue} €)</span>`;
      }

      const isOpen = !!openRateAgents[ag.id];
      const currentVal = agentRates[ag.id] !== undefined ? agentRates[ag.id] : '';

      const cardItem = document.createElement('div');
      cardItem.className = 'agent-card-item';
      cardItem.innerHTML = `
        <div class="agent-row">
          <div class="agent-info">
            <div class="dot" style="background: ${color};"></div>
            <span>${ag.name}</span>
          </div>
          <div class="agent-right" id="agent-right-${ag.id}">
            <button class="btn-agent-plus" onclick="toggleAgentRateBox('${ag.id}')">${isOpen ? '−' : '+'}</button>
            <span class="agent-time-text">${h}h${m < 10 ? '0' : ''}${m}</span>
            ${revenueText}
          </div>
        </div>
        <div class="agent-rate-panel ${isOpen ? 'open' : ''}">
          <span>Taux horaire personnalisé :</span>
          <input type="number" id="rate-input-${ag.id}" placeholder="€/h" min="0" step="0.5" value="${currentVal}" oninput="updateAgentRate('${ag.id}', this.value)">
        </div>
      `;
      agentsListEl.appendChild(cardItem);
    });

    updateCalculationsOnlyValues();
  }

  function exportSummary() {
    const filteredSlots = getFilteredSlots();
    let agentHours = {};
    agents.forEach(a => agentHours[a.id] = { name: a.name, minutes: 0 });

    filteredSlots.forEach(s => {
      if (s.start && s.end && agentHours[s.agent_id]) {
        const [sh, sm] = s.start.split(':').map(Number);
        const [eh, em] = s.end.split(':').map(Number);
        const diff = (eh * 60 + em) - (sh * 60 + sm) + 30;
        if (diff > 0) agentHours[s.agent_id].minutes += diff;
      }
    });

    let text = `📊 Récapitulatif Heures (${document.getElementById('modal-period-label').innerText}):\n`;
    Object.values(agentHours).forEach(ag => {
      const h = Math.floor(ag.minutes / 60);
      const m = ag.minutes % 60;
      if (ag.minutes > 0) {
        text += `- ${ag.name}: ${h}h${m < 10 ? '0' : ''}${m}\n`;
      }
    });

    navigator.clipboard.writeText(text);
    alert('Récapitulatif copié dans le presse-papier !');
  }

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(date.setDate(diff));
  }

  function changeWeek(direction) {
    currentDate.setDate(currentDate.getDate() + (direction * 7));
    renderWeek();
    updateHeaderStats();
  }

  init();
</script>

</body>
</html>
