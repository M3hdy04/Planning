<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Heures et Planning</title>
    <!-- Tailwind CSS pour un design moderne et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- En-tête -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900">Suivi des Heures Agents</h1>
            <p class="text-slate-500 mt-1">Calculez et gérez vos plannings en toute simplicité</p>
        </header>

        <!-- Formulaire d'ajout -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-slate-700">Ajouter un shift</h2>
            <form id="shiftForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Nom de l'agent</label>
                    <input type="text" id="agentName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Heure de début</label>
                    <input type="time" id="startTime" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Heure de fin</label>
                    <input type="time" id="endTime" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
                        Ajouter
                    </button>
                </div>
            </form>
        </div>

        <!-- Tableau des shifts -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-xl font-semibold text-slate-700">Plannings Enregistrés</h2>
                <button id="clearBtn" class="text-sm text-red-600 hover:text-red-800 font-medium">Tout effacer</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-sm uppercase tracking-wider">
                            <th class="py-3 px-6">Agent</th>
                            <th class="py-3 px-6">Début</th>
                            <th class="py-3 px-6">Fin</th>
                            <th class="py-3 px-6">Total Heures</th>
                            <th class="py-3 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="shiftTableBody" class="divide-y divide-slate-100">
                        <!-- Les lignes seront injectées ici par JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Résumé Global -->
        <div class="bg-blue-50 border border-blue-100 rounded-xl p-6 flex justify-between items-center">
            <div>
                <h3 class="text-lg font-semibold text-blue-900">Total Global des Heures</h3>
                <p class="text-sm text-blue-700">Somme de toutes les heures planifiées</p>
            </div>
            <div class="text-2xl font-bold text-blue-900" id="totalHoursDisplay">0h 00m</div>
        </div>

    </div>

    <!-- Script JavaScript -->
    <script>
        const shiftForm = document.getElementById('shiftForm');
        const shiftTableBody = document.getElementById('shiftTableBody');
        const totalHoursDisplay = document.getElementById('totalHoursDisplay');
        const clearBtn = document.getElementById('clearBtn');

        let shifts = JSON.parse(localStorage.getItem('shifts')) || [];

        function saveAndRender() {
            localStorage.setItem('shifts', JSON.stringify(shifts));
            renderShifts();
        }

        function calculateHours(start, end) {
            const [startHour, startMin] = start.split(':').map(Number);
            const [endHour, endMin] = end.split(':').map(Number);
            
            let startTotalMinutes = startHour * 60 + startMin;
            let endTotalMinutes = endHour * 60 + endMin;

            if (endTotalMinutes < startTotalMinutes) {
                endTotalMinutes += 24 * 60; // Gère les shifts de nuit
            }

            const diffMinutes = endTotalMinutes - startTotalMinutes;
            const hours = Math.floor(diffMinutes / 60);
            const minutes = diffMinutes % 60;

            return { hours, minutes, totalMinutes: diffMinutes };
        }

        function renderShifts() {
            shiftTableBody.innerHTML = '';
            let globalMinutes = 0;

            if (shifts.length === 0) {
                shiftTableBody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">Aucun shift enregistré pour le moment.</td></tr>`;
                totalHoursDisplay.textContent = '0h 00m';
                return;
            }

            shifts.forEach((shift, index) => {
                const duration = calculateHours(shift.start, shift.end);
                globalMinutes += duration.totalMinutes;

                const row = document.createElement('tr');
                row.className = 'hover:bg-slate-50 transition';
                row.innerHTML = `
                    <td class="py-4 px-6 font-medium text-slate-800">${escapeHtml(shift.name)}</td>
                    <td class="py-4 px-6 text-slate-600">${shift.start}</td>
                    <td class="py-4 px-6 text-slate-600">${shift.end}</td>
                    <td class="py-4 px-6 text-slate-600">${duration.hours}h ${String(duration.minutes).padStart(2, '0')}m</td>
                    <td class="py-4 px-6 text-right">
                        <button onclick="deleteShift(${index})" class="text-red-500 hover:text-red-700 text-sm font-medium">Supprimer</button>
                    </td>
                `;
                shiftTableBody.appendChild(row);
            });

            const globalHours = Math.floor(globalMinutes / 60);
            const globalMins = globalMinutes % 60;
            totalHoursDisplay.textContent = `${globalHours}h ${String(globalMins).padStart(2, '0')}m`;
        }

        function deleteShift(index) {
            shifts.splice(index, 1);
            saveAndRender();
        }

        shiftForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('agentName').value.trim();
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;

            if (name && start && end) {
                shifts.push({ name, start, end });
                shiftForm.reset();
                saveAndRender();
            }
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('Voulez-vous vraiment effacer tous les shifts ?')) {
                shifts = [];
                saveAndRender();
            }
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Initialisation au chargement
        renderShifts();
    </script>
</body>
</html>
