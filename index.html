<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Gestion des plannings</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #84cc16;
      --accent-hover: #65a30d;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-color);
    }

    .btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .error-msg {
      color: var(--danger-color);
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1>Espace Connexion</h1>
      <p>Entrez vos identifiants pour continuer</p>
    </div>

    <div class="form-group">
      <label for="username-input">Identifiant</label>
      <input type="text" id="username-input" class="form-control" placeholder="Entrez votre identifiant" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password-input">Mot de passe</label>
      <input type="password" id="password-input" class="form-control" placeholder="Entrez votre mot de passe" autocomplete="current-password">
      <div id="login-error" class="error-msg">Identifiant ou mot de passe incorrect</div>
    </div>

    <button class="btn" onclick="handleLogin()">Se connecter</button>
  </div>

<script>
  const SUPABASE_URL = 'VOTRE_VRAIE_URL_SUPABASE';
  const SUPABASE_ANON_KEY = 'VOTRE_VRAIE_CLE_ANON';
  
  let db = null;
  try {
    db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    console.error("Erreur d'initialisation Supabase", e);
  }

  async function handleLogin() {
    const usernameInput = document.getElementById('username-input').value.trim();
    const passwordInput = document.getElementById('password-input').value;
    const errorDiv = document.getElementById('login-error');

    errorDiv.style.display = 'none';

    if (!usernameInput || !passwordInput) {
      errorDiv.innerText = "Veuillez remplir tous les champs";
      errorDiv.style.display = 'block';
      return;
    }

    try {
      const { data, error } = await db
        .from('profiles')
        .select('*')
        .eq('username', usernameInput)
        .single();

      if (error || !data) {
        errorDiv.innerText = "Utilisateur introuvable";
        errorDiv.style.display = 'block';
        return;
      }

      if (passwordInput === data.password) {
        localStorage.setItem('basicfit_logged_profile_id', data.id);
        window.location.href = 'index.html';
      } else {
        errorDiv.innerText = "Mot de passe incorrect";
        errorDiv.style.display = 'block';
      }
    } catch (err) {
      console.error("Erreur de connexion", err);
      errorDiv.innerText = "Erreur de connexion au serveur";
      errorDiv.style.display = 'block';
    }
  }

  document.getElementById('password-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      handleLogin();
    }
  });

  document.getElementById('username-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      document.getElementById('password-input').focus();
    }
  });
</script>

</body>
</html>
