<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Remplacements</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #1a1a1a;
      --accent: #22c55e;
      --border: #e5e7eb;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { max-width: 480px; width: 100%; }
    .header { background: #111; color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge { background: #222; border: 1px solid #333; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn-icon { background: white; border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
    .day-card { flex: 1; min-width: 55px; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 10px 4px; text-align: center; cursor: pointer; }
    .day-card.active { background: #111; color: white; border-color: #111; }
    .slot-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); position: relative; }
    .slot-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .slot-time { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .slot-club { color: #666; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; }
    .actions { display: flex; gap: 8px; }
    .btn-action { background: none; border: none; cursor: pointer; font-size: 1.1rem; opacity: 0.6; }
    .btn-action:hover { opacity: 1; }
    select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-top: 12px; font-size: 0.95rem; background: #f3f4f6; }
    .form-card { background: white; border: 2px solid #111; border-radius: 16px; padding: 16px; margin-top: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .btn-submit { width: 100%; background: #111; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-cancel { width: 100%; background: transparent; color: #666; border: 1px solid var(--border); padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <div style="color: #a3e635; font-size: 0.75rem; font-weight: 800;">BASIC FIT • ACCUEIL</div>
      <h1>Planning remplacements</h1>
    </div>
    <div class="badge" id="agent-count">👥 0</div>
  </div>

  <div class="nav">
    <button class="btn-icon" onclick="changeWeek(-1)">‹</button>
    <strong id="week-label">10 – 16 août 2026</strong>
    <button class="btn-icon" onclick="changeWeek(1)">›</button>
  </div>

  <div class="days" id="days-container"></div>

  <div id="slots-list"></div>

  <button class="btn-submit" onclick="showForm()">+ Ajouter un créneau</button>

  <!-- Formulaire d'ajout / modification -->
  <div class="form-card" id="slot-form" style="display: none;">
    <h3 id="form-title" style="margin-top:0;">Nouveau créneau</h3>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Début / Fin</label>
      <div style="display: flex; gap: 8px;">
        <input type="time" id="form-start" class="form-control" value="09:00">
        <input type="time" id="form-end" class="form-control" value="13:00">
      </div>
    </div>
    <div class="form-group">
      <label>Club</label>
      <input type="text" id="form-club" class="form-control" placeholder="ex. Thillois, Cernay...">
    </div>
    <button class="btn-submit" onclick="saveSlot()">Enregistrer</button>
    <button class="btn-cancel" onclick="hideForm()">Annuler</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://inyonzcwfjhzuzlhumzj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_s_-vJjAZgAbMy27Oh0RDpg_hxcJV1KX";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentDate = new Date();
  let selectedDateStr = new Date().toISOString().split('T')[0];
  let agents = [];
  let slots = [];

  async function init() {
    await fetchAgents();
    await fetchSlots();
    renderWeek();
  }

  async function fetchAgents() {
    const { data } = await db.from('agents').select('*');
    agents = data || [];
    document.getElementById('agent-count').innerText = `👥 ${agents.length}`;
  }

  async function fetchSlots() {
    const { data } = await db.from('slots').select('*');
    slots = data || [];
    renderSlots();
  }

  function renderWeek() {
    const container = document.getElementById('days-container');
    container.innerHTML = '';
    const startOfWeek = getMonday(currentDate);
    
    for (let i = 0; i < 7; i++) {
      const d = new Date(startOfWeek);
      d.setDate(d.getDate() + i);
      const dateStr = d.toISOString().split('T')[0];
      const dayName = d.toLocaleDateString('fr-FR', { weekday: 'short' });
      const dayNum = d.getDate();

      const card = document.createElement('div');
      card.className = `day-card ${dateStr === selectedDateStr ? 'active' : ''}`;
      card.innerHTML = `<div style="font-size:0.8rem">${dayName}</div><strong>${dayNum}</strong>`;
      card.onclick = () => { selectedDateStr = dateStr; renderWeek(); renderSlots(); };
      container.appendChild(card);
    }
  }

  function renderSlots() {
    const list = document.getElementById('slots-list');
    list.innerHTML = '';
    const daySlots = slots.filter(s => s.date_str === selectedDateStr);

    if (daySlots.length === 0) {
      list.innerHTML = `<div style="text-align:center; color:#888; padding:20px;">Aucun créneau ce jour-là.</div>`;
      return;
    }

    daySlots.forEach(s => {
      const card = document.createElement('div');
      card.className = 'slot-card';
      
      let agentOptions = `<option value="">— À pourvoir —</option>`;
      agents.forEach(a => {
        agentOptions += `<option value="${a.id}" ${s.agent_id == a.id ? 'selected' : ''}>${a.name}</option>`;
      });

      card.innerHTML = `
        <div class="slot-header">
          <div>
            <div class="slot-time">${s.start} – ${s.end}</div>
            <div class="slot-club">📍 ${s.club || 'Non précisé'}</div>
          </div>
          <div class="actions">
            <button class="btn-action" onclick="editSlot(${s.id})">✏️</button>
            <button class="btn-action" onclick="deleteSlot(${s.id})">🗑️</button>
          </div>
        </div>
        <select onchange="updateAgent(${s.id}, this.value)">${agentOptions}</select>
      `;
      list.appendChild(card);
    });
  }

  function showForm(slot = null) {
    document.getElementById('slot-form').style.display = 'block';
    if (slot) {
      document.getElementById('form-title').innerText = "Modifier le créneau";
      document.getElementById('edit-id').value = slot.id;
      document.getElementById('form-start').value = slot.start;
      document.getElementById('form-end').value = slot.end;
      document.getElementById('form-club').value = slot.club || '';
    } else {
      document.getElementById('form-title').innerText = "Nouveau créneau";
      document.getElementById('edit-id').value = '';
    }
  }

  function hideForm() {
    document.getElementById('slot-form').style.display = 'none';
  }

  async function saveSlot() {
    const id = document.getElementById('edit-id').value;
    const start = document.getElementById('form-start').value;
    const end = document.getElementById('form-end').value;
    const club = document.getElementById('form-club').value;

    if (id) {
      await db.from('slots').update({ start, end, club }).eq('id', id);
    } else {
      await db.from('slots').insert([{ date_str: selectedDateStr, start, end, club }]);
    }

    hideForm();
    await fetchSlots();
  }

  function editSlot(id) {
    const slot = slots.find(s => s.id === id);
    if (slot) showForm(slot);
  }

  async function updateAgent(slotId, agentId) {
    await db.from('slots').update({ agent_id: agentId ? parseInt(agentId) : null }).eq('id', slotId);
    await fetchSlots();
  }

  async function deleteSlot(id) {
    if (confirm('Supprimer ce créneau ?')) {
      await db.from('slots').delete().eq('id', id);
      await fetchSlots();
    }
  }

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(date.setDate(diff));
  }

  function changeWeek(direction) {
    currentDate.setDate(currentDate.getDate() + (direction * 7));
    renderWeek();
  }

  init();
</script>
</body>
</html>
