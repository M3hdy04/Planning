<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion et Tri des Agents</title>
  <!-- Inclusion du SDK Supabase (version CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      text-align: center;
    }
    .filters-container {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      justify-content: center;
    }
    select {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
    }
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .agent-card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border-top: 4px solid #007bff;
    }
    .agent-card h3 {
      margin-top: 0;
      color: #007bff;
    }
    .badge {
      background: #e9ecef;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    .no-results {
      text-align: center;
      grid-column: 1 / -1;
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Liste des Agents par Secteur</h1>

    <!-- Filtres et Tri -->
    <div class="filters-container">
      <select id="filterSecteur" onchange="filterAndSortAgents()">
        <option value="">Tous les secteurs</option>
        <option value="Nord">Nord</option>
        <option value="Sud">Sud</option>
        <option value="Est">Est</option>
        <option value="Ouest">Ouest</option>
      </select>

      <select id="sortBy" onchange="filterAndSortAgents()">
        <option value="name_asc">Nom (A-Z)</option>
        <option value="name_desc">Nom (Z-A)</option>
        <option value="secteur">Secteur</option>
      </select>
    </div>

    <!-- Conteneur des profils d'agents -->
    <div id="agentsList" class="agents-grid">
      <p class="no-results">Chargement des agents...</p>
    </div>
  </div>

  <script>
    // --- CONFIGURATION SUPABASE ---
    const SUPABASE_URL = 'https://inyonzcwfjhzuzlhumzj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlueW9uemN3ZmpoenV6bGh1bXpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjU5NzUsImV4cCI6MjEwMjA0MTk3NX0.I3OBttFLZitL8UMmqiP4iylg2au1atGifGjosK5EbXM';
    
    // Initialisation du client Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allAgents = [];

    // 1. Récupérer les agents depuis Supabase
    async function fetchAgents() {
      const { data, error } = await supabase
        .from('agents')
        .select('*');

      if (error) {
        console.error('Erreur lors du chargement des agents :', error);
        document.getElementById('agentsList').innerHTML = '<p class="no-results">Erreur de chargement des données.</p>';
        return;
      }

      allAgents = data || [];
      filterAndSortAgents();
    }

    // 2. Fonction principale de filtrage et de tri en local
    function filterAndSortAgents() {
      const selectedSecteur = document.getElementById('filterSecteur').value;
      const sortCriteria = document.getElementById('sortBy').value;

      // Étape A : Filtrage par secteur
      let filtered = allAgents.filter(agent => {
        if (!selectedSecteur) return true;
        return agent.secteur === selectedSecteur;
      });

      // Étape B : Tri des profils
      filtered.sort((a, b) => {
        if (sortCriteria === 'name_asc') {
          return (a.nom || '').localeCompare(b.nom || '');
        } else if (sortCriteria === 'name_desc') {
          return (b.nom || '').localeCompare(a.nom || '');
        } else if (sortCriteria === 'secteur') {
          return (a.secteur || '').localeCompare(b.secteur || '');
        }
        return 0;
      });

      // Étape C : Affichage
      renderAgents(filtered);
    }

    // 3. Rendu visuel des cartes profils dans le DOM
    function renderAgents(agents) {
      const container = document.getElementById('agentsList');
      container.innerHTML = '';

      if (agents.length === 0) {
        container.innerHTML = '<p class="no-results">Aucun agent trouvé pour ce critère.</p>';
        return;
      }

      agents.forEach(agent => {
        const card = document.createElement('div');
        card.className = 'agent-card';
        card.innerHTML = `
          <h3>${agent.nom || 'Sans nom'}</h3>
          <p><strong>Secteur :</strong> <span class="badge">${agent.secteur || 'Non défini'}</span></p>
          <p><strong>Email :</strong> ${agent.email || '-'}</p>
        `;
        container.appendChild(card);
      });
    }

    // Lancer la récupération au démarrage
    fetchAgents();
  </script>

</body>
</html>
