<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Gestion des plannings</title>
  <!-- SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #84cc16;
      --accent-hover: #65a30d;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* Vues du système d'authentification */
    .auth-view {
      display: none;
    }

    .auth-view.active {
      display: block;
    }

    /* Grille des profils */
    .profiles-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding-right: 4px;
    }

    .profile-card {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .profile-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-1px);
    }

    .profile-info {
      display: flex;
      flex-direction: column;
    }

    .profile-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .profile-role {
      font-size: 0.75rem;
      color: var(--accent-color);
      font-weight: 500;
      margin-top: 2px;
    }

    .profile-arrow {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Formulaire de mot de passe */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-color);
    }

    .btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
      color: var(--text-color);
    }

    .selected-user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--bg-color);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .selected-user-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .error-msg {
      color: var(--danger-color);
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1>Espace Connexion</h1>
      <p>Sélectionnez votre profil pour continuer</p>
    </div>

    <!-- VUE 1 : Liste des profils -->
    <div id="auth-view-profiles" class="auth-view active">
      <div id="profiles-list" class="profiles-grid">
        <div style="text-align: center; color: var(--text-muted); padding: 20px;">Chargement des profils...</div>
      </div>
    </div>

    <!-- VUE 2 : Saisie du mot de passe -->
    <div id="auth-view-password" class="auth-view">
      <div class="selected-user-badge">
        <div>👤</div>
        <div class="selected-user-name" id="selected-profile-name">Nom du profil</div>
      </div>
      
      <div class="form-group">
        <label for="password-input">Mot de passe</label>
        <input type="password" id="password-input" class="form-control" placeholder="Entrez votre mot de passe">
        <div id="login-error" class="error-msg">Mot de passe incorrect</div>
      </div>

      <button class="btn" onclick="handleLogin()">Se connecter</button>
      <button class="btn btn-secondary" onclick="backToProfiles()">← Changer de profil</button>
    </div>
  </div>

<script>
  // Configuration Supabase (remplacez par vos identifiants si ce n'est pas déjà fait dans votre fichier global)
  const SUPABASE_URL = 'VOTRE_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'VOTRE_SUPABASE_ANON_KEY';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let selectedProfile = null;

  async function initAuthScreen() {
    const listContainer = document.getElementById('profiles-list');
    const { data, error } = await db.from('profiles').select('*').order('name');

    if (error || !data || data.length === 0) {
      listContainer.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Aucun profil trouvé.</div>`;
      return;
    }

    listContainer.innerHTML = '';
    data.forEach(profile => {
      const card = document.createElement('div');
      card.className = 'profile-card';
      card.innerHTML = `
        <div class="profile-info">
          <span class="profile-name">${profile.name}</span>
          <span class="profile-role">${profile.role || 'Utilisateur'}</span>
        </div>
        <div class="profile-arrow">›</div>
      `;
      card.onclick = () => selectProfile(profile);
      listContainer.appendChild(card);
    });
  }

  function selectProfile(profile) {
    selectedProfile = profile;
    document.getElementById('selected-profile-name').innerText = profile.name;
    document.getElementById('password-input').value = '';
    document.getElementById('login-error').style.display = 'none';

    document.getElementById('auth-view-profiles').classList.remove('active');
    document.getElementById('auth-view-password').classList.add('active');
    document.getElementById('password-input').focus();
  }

  function backToProfiles() {
    selectedProfile = null;
    document.getElementById('auth-view-password').classList.remove('active');
    document.getElementById('auth-view-profiles').classList.add('active');
  }

  async function handleLogin() {
    const passwordInput = document.getElementById('password-input').value;
    const errorDiv = document.getElementById('login-error');

    if (!selectedProfile) return;

    if (passwordInput === selectedProfile.password) {
      localStorage.setItem('basicfit_logged_profile_id', selectedProfile.id);
      window.location.href = 'index.html'; // Redirigez vers votre page principale (ex: index.html ou app.html)
    } else {
      errorDiv.style.display = 'block';
    }
  }

  document.getElementById('password-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      handleLogin();
    }
  });

  window.onload = initAuthScreen;
</script>

</body>
</html>
