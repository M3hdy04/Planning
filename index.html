<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Remplacements</title>
    <style>
        /* Base styles */
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Modal & UI Elements */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .hourly-rate-container {
            margin: 15px 0;
            text-align: center;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
        }
        .hourly-rate-container input {
            padding: 6px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            width: 80px;
            text-align: center;
        }
        .agent-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>BASIC FIT - ACCUEIL</h2>
        <h3>PLANNING REMPLACEMENTS</h3>
        
        <!-- Bouton ou déclencheur pour les totaux d'heures (exemple) -->
        <button id="openHoursModal" style="padding: 10px 15px; background: #fff; color: #111; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
            Totaux d'heures & Salaires
        </button>
    </div>

    <!-- Modale Totaux d'heures avec option de calcul du chiffre d'affaires / salaire -->
    <div id="hoursModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="close-btn" id="closeHoursModal">&times;</button>
            <h3 style="text-align: center; margin-top: 0;">Totaux d'heures</h3>
            
            <!-- Option de calcul du chiffre d'affaires basé sur le taux horaire -->
            <div class="hourly-rate-container">
                <label for="hourlyRateInput">Calcul CA / Taux horaire (€) : </label>
                <input type="number" id="hourlyRateInput" placeholder="Ex: 12" min="0" step="0.5" />
            </div>

            <div id="agentHoursList">
                <div class="agent-row" data-decimal="64.0">
                    <span>🟢 Mehdi</span>
                    <div><span class="agent-hours">64h00</span><span class="agent-revenue" style="color: #4cd137; font-weight: bold;"></span></div>
                </div>
                <div class="agent-row" data-decimal="63.5">
                    <span>🔵 Alexandre</span>
                    <div><span class="agent-hours">63h30</span><span class="agent-revenue" style="color: #4cd137; font-weight: bold;"></span></div>
                </div>
                <div class="agent-row" data-decimal="51.5">
                    <span>🟣 Yanis</span>
                    <div><span class="agent-hours">51h30</span><span class="agent-revenue" style="color: #4cd137; font-weight: bold;"></span></div>
                </div>
                <div class="agent-row" data-decimal="43.5">
                    <span>🔵 Amel</span>
                    <div><span class="agent-hours">43h30</span><span class="agent-revenue" style="color: #4cd137; font-weight: bold;"></span></div>
                </div>
                <div class="agent-row" data-decimal="33.5">
                    <span>🟠 Luc</span>
                    <div><span class="agent-hours">33h30</span><span class="agent-revenue" style="color: #4cd137; font-weight: bold;"></span></div>
                </div>
                <div class="agent-row" data-decimal="32.5">
                    <span>🔵 Sean</span>
                    <div><span class="agent-hours">32h30</span><span class="agent-revenue" style="color: #4cd137; font-weight: bold;"></span></div>
                </div>
                <div class="agent-row" data-decimal="10.0">
                    <span>🟢 Jason</span>
                    <div><span class="agent-hours">10h00</span><span class="agent-revenue" style="color: #4cd137; font-weight: bold;"></span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Logique d'affichage de la modale
        const modal = document.getElementById('hoursModal');
        const openBtn = document.getElementById('openHoursModal');
        const closeBtn = document.getElementById('closeHoursModal');
        const rateInput = document.getElementById('hourlyRateInput');

        openBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Fonction de calcul dynamique du chiffre d'affaires / salaire
        function updateRevenues() {
            const rate = parseFloat(rateInput.value);
            
            document.querySelectorAll('.agent-row').forEach(row => {
                const decimalHours = parseFloat(row.getAttribute('data-decimal'));
                const revenueSpan = row.querySelector('.agent-revenue');

                if (isNaN(rate) || rate <= 0) {
                    revenueSpan.textContent = '';
                } else {
                    const totalPay = (decimalHours * rate).toFixed(2);
                    revenueSpan.textContent = ` (${totalPay} €)`;
                }
            });
        }

        rateInput.addEventListener('input', updateRevenues);
    </script>
</body>
</html>
