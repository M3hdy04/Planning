<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Remplacements</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #1a1a1a;
      --border: #e5e7eb;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { max-width: 480px; width: 100%; }
    .header { background: #111; color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .badges-group { display: flex; gap: 6px; }
    .badge { background: #222; border: 1px solid #333; padding: 6px 10px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 4px; color: white; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .btn-icon { background: white; border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
    .day-card { flex: 1; min-width: 55px; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 10px 4px; text-align: center; cursor: pointer; position: relative; }
    .day-card.active { background: #111; color: white; border-color: #111; }
    .day-progress { position: absolute; bottom: 4px; left: 6px; right: 6px; height: 3px; background: #e5e7eb; border-radius: 2px; overflow: hidden; }
    .day-progress-bar { height: 100%; background: #22c55e; width: 0%; }
    .day-card.active .day-progress { background: #333; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; font-size: 1.1rem; }
    .slot-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); position: relative; }
    .slot-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .slot-time { font-size: 1.2rem; font-weight: 700; }
    .slot-club { color: #666; font-size: 0.9rem; margin-top: 2px; }
    .slot-actions { display: flex; gap: 4px; }
    .btn-action { background: #f3f4f6; border: none; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; }
    
    .select-wrapper { position: relative; width: 100%; margin-top: 8px; }
    .select-wrapper::before { content: ''; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--dot-color, #ccc); z-index: 2; pointer-events: none; }
    select { width: 100%; padding: 10px 10px 10px 30px; border-radius: 10px; border: none; font-size: 0.95rem; background: #f3f4f6; appearance: none; cursor: pointer; font-weight: 500; }
    
    .form-card { background: white; border: 2px solid #111; border-radius: 16px; padding: 16px; margin-top: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
    .btn-submit { width: 100%; background: #111; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-cancel { width: 100%; background: transparent; color: #666; border: 1px solid var(--border); padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    
    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
    .modal-card { background: white; width: 100%; max-width: 420px; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: #f3f4f6; border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; color: #007aff; }
    .toggle-container { display: flex; background: #f3f4f6; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
    .toggle-btn { flex: 1; padding: 8px; text-align: center; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: #666; }
    .toggle-btn.active { background: #111; color: #a3e635; }
    .total-banner { background: #111; color: white; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 16px; }
    .total-banner h2 { color: #a3e635; margin: 0 0 4px 0; font-size: 2.2rem; }
    .total-banner p { margin: 0; font-size: 0.85rem; opacity: 0.8; }
    .agent-row { display: flex; justify-content: space-between; align-items: center; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 8px; font-weight: 600; }
    .agent-info { display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <div style="color: #a3e635; font-size: 0.75rem; font-weight: 800;">BASIC FIT • ACCUEIL</div>
      <h1>Planning remplacements</h1>
    </div>
    <div class="badges-group">
      <div class="badge" onclick="openTotalModal()">⏱️ Totaux</div>
      <div class="badge" onclick="openAgentsModal()">👥 <span id="agent-count-badge">0</span></div>
    </div>
  </div>

  <div class="nav">
    <button class="btn-icon" onclick="changeWeek(-1)">‹</button>
    <strong id="week-label">10 – 16 août 2026</strong>
    <button class="btn-icon" onclick="changeWeek(1)">›</button>
  </div>

  <div class="days" id="days-container"></div>

  <div class="section-header">
    <span id="selected-day-title">Mardi 11 Août</span>
    <span id="day-covered-count" style="font-size: 0.9rem; color: #22c55e;">0/0 couverts</span>
  </div>

  <div id="slots-list"></div>

  <button class="btn-submit" onclick="showForm()">+ Ajouter un créneau</button>

  <!-- Formulaire Créneau -->
  <div class="form-card" id="slot-form" style="display: none;">
    <h3 id="form-title" style="margin-top:0;">Nouveau créneau</h3>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Début / Fin</label>
      <div style="display: flex; gap: 8px;">
        <input type="time" id="form-start" class="form-control" value="09:00">
        <input type="time" id="form-end" class="form-control" value="13:00">
      </div>
    </div>
    <div class="form-group">
      <label>Club</label>
      <input type="text" id="form-club" class="form-control" placeholder="ex. Thillois, Cernay...">
    </div>
    <button class="btn-submit" onclick="saveSlot()">Enregistrer</button>
    <button class="btn-cancel" onclick="hideForm()">Annuler</button>
  </div>
</div>

<!-- Modal Totaux -->
<div class="modal-overlay" id="total-modal" style="display: none;">
  <div class="modal-card">
    <button class="modal-close" onclick="closeTotalModal()">✕</button>
    <h3 style="margin-top:0; margin-bottom: 16px;">Totaux d'heures</h3>
    
    <div class="toggle-container">
      <button class="toggle-btn" id="btn-semaine" onclick="switchTotalTab('semaine')">Semaine</button>
      <button class="toggle-btn active" id="btn-mois" onclick="switchTotalTab('mois')">Mois</button>
    </div>

    <div class="nav" style="margin-bottom: 12px;">
      <button class="btn-icon" onclick="changeModalDate(-1)">‹</button>
      <strong id="modal-period-label">Août 2026</strong>
      <button class="btn-icon" onclick="changeModalDate(1)">›</button>
    </div>

    <div class="total-banner">
      <h2 id="modal-total-hours">0h00</h2>
      <p>heures couvertes au total</p>
    </div>

    <div id="modal-agents-list"></div>

    <div style="font-size: 0.75rem; color: #888; text-align: center; margin-top: 16px;">
      Chaque créneau inclut 30 min de pointage effectuées avant le début du service.
    </div>
  </div>
</div>

<!-- Modal Gestion Agents -->
<div class="modal-overlay" id="agents-modal" style="display: none;">
  <div class="modal-card">
    <button class="modal-close" onclick="closeAgentsModal()">✕</button>
    <h3 style="margin-top:0; margin-bottom: 16px;">Gestion des agents</h3>
    
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <input type="text" id="new-agent-name" class="form-control" placeholder="Nom du nouvel agent">
      <button class="btn-submit" style="margin-top:0; width: auto; padding: 0 16px;" onclick="addAgent()">Ajouter</button>
    </div>

    <div id="agents-manage-list"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://inyonzcwfjhzuzlhumzj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_s_-vJjAZgAbMy27Oh0RDpg_hxcJV1KX";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentDate = new Date();
  let selectedDateStr = new Date().toISOString().split('T')[0];
  let agents = [];
  let slots = [];
  
  let modalTab = 'mois';
  let modalDate = new Date();

  const agentColors = ['#22c55e', '#3b82f6', '#ec4899', '#8b5cf6', '#f59e0b', '#06b6d4', '#10b981'];

  async function init() {
    await fetchAgents();
    await fetchSlots();
    renderWeek();
  }

  async function fetchAgents() {
    const { data } = await db.from('agents').select('*').order('name');
    agents = data || [];
    document.getElementById('agent-count-badge').innerText = agents.length;
  }

  async function fetchSlots() {
    const { data } = await db.from('slots').select('*');
    slots = data || [];
    renderWeek();
    renderSlots();
  }

  function renderWeek() {
    const container = document.getElementById('days-container');
    container.innerHTML = '';
    const startOfWeek = getMonday(currentDate);
    
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(endOfWeek.getDate() + 6);
    document.getElementById('week-label').innerText = `${startOfWeek.toLocaleDateString('fr-FR', {day: 'numeric', month: 'long'})} – ${endOfWeek.toLocaleDateString('fr-FR', {day: 'numeric', month: 'long', year: 'numeric'})}`;

    for (let i = 0; i < 7; i++) {
      const d = new Date(startOfWeek);
      d.setDate(d.getDate() + i);
      const dateStr = d.toISOString().split('T')[0];
      const dayName = d.toLocaleDateString('fr-FR', { weekday: 'short' });
      const dayNum = d.getDate();

      const daySlots = slots.filter(s => s.date_str === dateStr);
      const totalDay = daySlots.length;
      const coveredDay = daySlots.filter(s => s.agent_id !== null).length;
      const percent = totalDay > 0 ? (coveredDay / totalDay) * 100 : 0;

      const card = document.createElement('div');
      card.className = `day-card ${dateStr === selectedDateStr ? 'active' : ''}`;
      card.innerHTML = `
        <div style="font-size:0.8rem">${dayName}</div>
        <strong>${dayNum}</strong>
        <div class="day-progress">
          <div class="day-progress-bar" style="width: ${percent}%;"></div>
        </div>
      `;
      card.onclick = () => { selectedDateStr = dateStr; renderWeek(); renderSlots(); };
      container.appendChild(card);
    }
  }

  function renderSlots() {
    const list = document.getElementById('slots-list');
    list.innerHTML = '';
    const daySlots = slots.filter(s => s.date_str === selectedDateStr);

    const selDate = new Date(selectedDateStr + 'T00:00:00');
    document.getElementById('selected-day-title').innerText = selDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

    const covered = daySlots.filter(s => s.agent_id !== null).length;
    document.getElementById('day-covered-count').innerText = `${covered}/${daySlots.length} couverts`;

    if (daySlots.length === 0) {
      list.innerHTML = `<div style="text-align:center; color:#888; padding:20px;">Aucun créneau ce jour-là.</div>`;
      return;
    }

    daySlots.forEach(s => {
      const card = document.createElement('div');
      card.className = 'slot-card';
      
      let agentOptions = `<option value="">— À pourvoir —</option>`;
      let selectedAgentColor = '#ccc';

      agents.forEach((a, index) => {
        const isSelected = s.agent_id == a.id;
        if (isSelected) {
          selectedAgentColor = agentColors[index % agentColors.length];
        }
        agentOptions += `<option value="${a.id}" ${isSelected ? 'selected' : ''}>${a.name}</option>`;
      });

      card.style.setProperty('--dot-color', selectedAgentColor);

      card.innerHTML = `
        <div class="slot-top">
          <div>
            <div class="slot-time">${s.start} – ${s.end}</div>
            <div class="slot-club">📍 ${s.club || 'Non précisé'}</div>
          </div>
          <div class="slot-actions">
            <button class="btn-action" onclick="editSlot('${s.id}')">✏️</button>
            <button class="btn-action" onclick="deleteSlot('${s.id}')">🗑️</button>
          </div>
        </div>
        <div class="select-wrapper">
          <select onchange="updateAgent('${s.id}', this.value)">${agentOptions}</select>
        </div>
      `;
      list.appendChild(card);
    });
  }

  function showForm(slot = null) {
    const formCard = document.getElementById('slot-form');
    formCard.style.display = 'block';
    formCard.scrollIntoView({ behavior: 'smooth' });

    if (slot) {
      document.getElementById('form-title').innerText = "Modifier le créneau";
      document.getElementById('edit-id').value = slot.id;
      document.getElementById('form-start').value = slot.start;
      document.getElementById('form-end').value = slot.end;
      document.getElementById('form-club').value = slot.club || '';
    } else {
      document.getElementById('form-title').innerText = "Nouveau créneau";
      document.getElementById('edit-id').value = '';
      document.getElementById('form-start').value = '09:00';
      document.getElementById('form-end').value = '13:00';
      document.getElementById('form-club').value = '';
    }
  }

  function hideForm() {
    document.getElementById('slot-form').style.display = 'none';
  }

  async function saveSlot() {
    const id = document.getElementById('edit-id').value;
    const start = document.getElementById('form-start').value;
    const end = document.getElementById('form-end').value;
    const club = document.getElementById('form-club').value;

    if (id) {
      await db.from('slots').update({ start, end, club }).eq('id', id);
    } else {
      await db.from('slots').insert([{ date_str: selectedDateStr, start, end, club }]);
    }

    hideForm();
    await fetchSlots();
  }

  function editSlot(id) {
    const slot = slots.find(s => String(s.id) === String(id));
    if (slot) showForm(slot);
  }

  async function updateAgent(slotId, agentId) {
    await db.from('slots').update({ agent_id: agentId ? parseInt(agentId) : null }).eq('id', slotId);
    await fetchSlots();
  }

  async function deleteSlot(id) {
    if (confirm('Supprimer ce créneau ?')) {
      await db.from('slots').delete().eq('id', id);
      await fetchSlots();
    }
  }

  // Gestion des agents
  function openAgentsModal() {
    document.getElementById('agents-modal').style.display = 'flex';
    renderAgentsManageList();
  }

  function closeAgentsModal() {
    document.getElementById('agents-modal').style.display = 'none';
  }

  async function addAgent() {
    const nameInput = document.getElementById('new-agent-name');
    const name = nameInput.value.trim();
    if (!name) return;

    await db.from('agents').insert([{ name }]);
    nameInput.value = '';
    await fetchAgents();
    renderAgentsManageList();
    renderSlots();
  }

  async function deleteAgent(id) {
    if (confirm('Supprimer cet agent ?')) {
      await db.from('agents').delete().eq('id', id);
      await fetchAgents();
      renderAgentsManageList();
      fetchSlots();
    }
  }

  function renderAgentsManageList() {
    const container = document.getElementById('agents-manage-list');
    container.innerHTML = '';
    agents.forEach((a, index) => {
      const color = agentColors[index % agentColors.length];
      const row = document.createElement('div');
      row.className = 'agent-row';
      row.innerHTML = `
        <div class="agent-info">
          <div class="dot" style="background: ${color};"></div>
          <span>${a.name}</span>
        </div>
        <button class="btn-action" onclick="deleteAgent('${a.id}')">🗑️</button>
      `;
      container.appendChild(row);
    });
  }

  // Gestion des Totaux
  function openTotalModal() {
    modalDate = new Date(currentDate);
    document.getElementById('total-modal').style.display = 'flex';
    updateModalContent();
  }

  function closeTotalModal() {
    document.getElementById('total-modal').style.display = 'none';
  }

  function switchTotalTab(tab) {
    modalTab = tab;
    document.getElementById('btn-semaine').className = `toggle-btn ${tab === 'semaine' ? 'active' : ''}`;
    document.getElementById('btn-mois').className = `toggle-btn ${tab === 'mois' ? 'active' : ''}`;
    updateModalContent();
  }

  function changeModalDate(direction) {
    if (modalTab === 'mois') {
      modalDate.setMonth(modalDate.getMonth() + direction);
    } else {
      modalDate.setDate(modalDate.getDate() + (direction * 7));
    }
    updateModalContent();
  }

  function updateModalContent() {
    const labelEl = document.getElementById('modal-period-label');
    const totalHoursEl = document.getElementById('modal-total-hours');
    const agentsListEl = document.getElementById('modal-agents-list');

    let filteredSlots = [];

    if (modalTab === 'mois') {
      const year = modalDate.getFullYear();
      const month = modalDate.getMonth();
      labelEl.innerText = modalDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      
      filteredSlots = slots.filter(s => {
        const d = new Date(s.date_str);
        return d.getFullYear() === year && d.getMonth() === month;
      });
    } else {
      const startOfWeek = getMonday(modalDate);
      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(endOfWeek.getDate() + 6);
      labelEl.innerText = `${startOfWeek.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'})} – ${endOfWeek.toLocaleDateString('fr-FR', {day: 'numeric', month: 'short', year: 'numeric'})}`;

      filteredSlots = slots.filter(s => {
        const d = new Date(s.date_str);
        return d >= startOfWeek && d <= endOfWeek;
      });
    }

    let agentHours = {};
    agents.forEach(a => agentHours[a.id] = { name: a.name, minutes: 0 });

    let totalMins = 0;
    filteredSlots.forEach(s => {
      if (s.start && s.end && s.agent_id && agentHours[s.agent_id]) {
        const [sh, sm] = s.start.split(':').map(Number);
        const [eh, em] = s.end.split(':').map(Number);
        const diff = (eh * 60 + em) - (sh * 60 + sm);
        if (diff > 0) {
          agentHours[s.agent_id].minutes += diff;
          totalMins += diff;
        }
      }
    });

    const totalH = Math.floor(totalMins / 60);
    const totalM = totalMins % 60;
    totalHoursEl.innerText = `${totalH}h${totalM < 10 ? '0' : ''}${totalM}`;

    agentsListEl.innerHTML = '';
    const sortedAgents = Object.values(agentHours).sort((a, b) => b.minutes - a.minutes);

    sortedAgents.forEach((ag, index) => {
      const h = Math.floor(ag.minutes / 60);
      const m = ag.minutes % 60;
      const color = agentColors[index % agentColors.length];

      const row = document.createElement('div');
      row.className = 'agent-row';
      row.innerHTML = `
        <div class="agent-info">
          <div class="dot" style="background: ${color};"></div>
          <span>${ag.name}</span>
        </div>
        <span>${h}h${m < 10 ? '0' : ''}${m}</span>
      `;
      agentsListEl.appendChild(row);
    });
  }

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(date.setDate(diff));
  }

  function changeWeek(direction) {
    currentDate.setDate(currentDate.getDate() + (direction * 7));
    renderWeek();
  }

  init();
</script>
</body>
</html>
