<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning Remplacements</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #1alala;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1400px; margin: 0 auto; }
        .header { background: #111; color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .header-left { display: flex; flex-direction: column; gap: 4px; }
        
        .custom-dropdown { position: relative; display: inline-block; }
        .custom-dropdown-btn { background: #222; color: #ae635; border: 1px solid #333; padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .custom-dropdown-content { display: none; position: absolute; top: 110%; left: 0; background: #222; border: 1px solid #333; border-radius: 8px; box-shadow: var(--shadow); z-index: 100; min-width: 160px; }
        .custom-dropdown-content.open { display: block; }
        .custom-dropdown-item { padding: 10px 14px; font-size: 0.85rem; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); color: #fff; }
        .custom-dropdown-item:hover { background: #333; }
        .custom-dropdown-item.active { background: #ae635; font-weight: 700; }
        
        .badges-group { display: flex; gap: 6px; align-items: center; }
        .badge { background: #222; border: 1px solid #333; padding: 6px 10px; border-radius: 20px; font-size: 0.8rem; color: #fff; }
        
        .profile-btn { background: #222; border: 1px solid #333; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; }
        .profile-dropdown { display: none; position: absolute; top: 75px; right: 20px; background: #222; border: 1px solid #333; border-radius: 8px; width: 220px; z-index: 100; box-shadow: var(--shadow); }
        .profile-dropdown.open { display: block; }
        .profile-dropdown-header { padding: 14px 16px; border-bottom: 1px solid #333; }
        .profile-dropdown-header .role { font-size: 0.75rem; color: #ae635; font-weight: 700; text-transform: uppercase; }
        .profile-dropdown-header .name { font-size: 0.95rem; font-weight: 600; color: #fff; }
        .profile-dropdown-item { padding: 12px 16px; font-size: 0.9rem; cursor: pointer; color: #fff; display: block; width: 100%; text-align: left; background: none; border: none; }
        .profile-dropdown-item:hover { background: #333; }

        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .btn-icon { background: white; border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
        .day-card { flex: 1; min-width: 65px; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .day-card.active { background: #111; color: white; border-color: #111; }
        .day-progress { position: absolute; bottom: 4px; left: 6px; right: 6px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .day-progress-bar { height: 100%; background: #ae635; width: 0%; }
        
        .slot-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .slot-info { display: flex; flex-direction: column; gap: 4px; }
        .slot-time { font-weight: 700; font-size: 1.1rem; }
        .slot-agent { font-size: 0.9rem; color: #666; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.open { display: flex; }
        .modal-content { background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
        .btn { background: #111; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .auth-box { background: #1a1a1a; border: 1px solid #333; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; color: white; }
    </style>
</head>
<body>

    <!-- Écran de connexion -->
    <div id="auth-screen">
        <div class="auth-box">
            <p style="font-size: 0.75rem; color: #ae635; text-transform: uppercase; font-weight: 700; margin-bottom: 8px;">Basic Fit - Planning</p>
            <h2 style="margin-top: 0; margin-bottom: 20px;">Sélectionnez un profil</h2>
            <p style="color: #888; font-size: 0.9rem; margin-bottom: 20px;">Choisissez votre profil pour accéder au planning</p>
            <div id="profiles-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-left">
                <span style="font-size: 0.75rem; color: #ae635; font-weight: 700;" id="user-role-display"></span>
                <h1 id="user-name-display">Planning Remplacements</h1>
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="custom-dropdown" id="sector-filter-dropdown" style="display: none;">
                    <button class="custom-dropdown-btn" onclick="toggleSectorDropdown()">
                        <span id="selected-sector-label">Tous les secteurs</span>
                        <span style="font-size: 0.7rem;">▼</span>
                    </button>
                    <div class="custom-dropdown-content" id="sector-dropdown-content"></div>
                </div>
                <div style="position: relative;">
                    <div class="profile-btn" onclick="toggleProfileDropdown()">👤</div>
                    <div class="profile-dropdown" id="profile-dropdown">
                        <div class="profile-dropdown-header">
                            <div class="role" id="dropdown-role"></div>
                            <div class="name" id="dropdown-name"></div>
                        </div>
                        <button class="profile-dropdown-item" onclick="logout()">Changer de profil</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="nav">
            <button class="btn-icon" onclick="changeWeek(-1)">❮</button>
            <h3 id="week-label" style="margin: 0; font-size: 1rem;">Semaine</h3>
            <button class="btn-icon" onclick="changeWeek(1)">❯</button>
        </div>

        <div class="days" id="days-container"></div>

        <div style="display: flex; justify-space: between; align-items: center; margin-bottom: 16px;">
            <h3 id="selected-date-label" style="margin: 0; font-size: 1.1rem;">Créneaux</h3>
            <button class="btn" id="add-slot-btn" style="width: auto; padding: 8px 14px; font-size: 0.85rem; display: none;" onclick="openModal()">+ Ajouter un créneau</button>
        </div>

        <div id="slots-container"></div>
    </div>

    <!-- Modal Ajout de créneau -->
    <div class="modal" id="slot-modal">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Ajouter un créneau</h3>
            <form id="slot-form" onsubmit="saveSlot(event)">
                <div class="form-group">
                    <label>Heure de début</label>
                    <input type="time" id="slot-time" class="form-control" required>
                </div>
                <div class="form-group" id="agent-select-group">
                    <label>Agent assigné</label>
                    <select id="slot-agent" class="form-control"></select>
                </div>
                <button type="submit" class="btn">Enregistrer</button>
                <button type="button" class="btn" style="background: #eee; color: #333; margin-top: 8px;" onclick="closeModal()">Annuler</button>
            </form>
        </div>
    </div>

    <script>
        // Configuration Supabase & Logique à connecter ici selon vos scripts initiaux
        function toggleProfileDropdown() {
            document.getElementById('profile-dropdown').classList.toggle('open');
        }
        function logout() {
            localStorage.removeItem('current_profile');
            location.reload();
        }
        // Restauration simple de la session si enregistrée dans localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedProfile = localStorage.getItem('current_profile');
            if(savedProfile) {
                document.getElementById('auth-screen').style.display = 'none';
            }
        });
    </script>
</body>
</html>
